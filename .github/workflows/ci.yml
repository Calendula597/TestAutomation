name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/electron/package-lock.json
      - name: Install Electron Worker dependencies
        working-directory: workers/electron
        run: npm ci
      - name: Install Chromium
        working-directory: backend
        run: mvn -B --no-transfer-progress -pl platform-server exec:java@playwright-install
      - name: Install display server for Electron
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Pull k6 image
        run: docker pull grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
      - name: Check whitebox Worker
        working-directory: workers/whitebox
        run: npm run check
      - name: Performance engine acceptance
        working-directory: backend
        run: mvn -B --no-transfer-progress -pl platform-server '-Dtest=PerformanceExecutionApiIntegrationTest' '-Dlogging.level.org.springframework.security=INFO' test
      - name: Backend tests and checks
        working-directory: backend
        run: xvfb-run -a mvn -B --no-transfer-progress verify

  native-windows:
    runs-on: windows-latest
    env:
      APPIUM_HOME: ${{ github.workspace }}/workers/appium/.appium
      NATIVE_TEST_DB_URL: jdbc:postgresql://127.0.0.1:55433/test
      NATIVE_TEST_DB_USERNAME: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/appium/package-lock.json
      - name: Start native PostgreSQL with pgvector
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PGROOT = "C:\Program Files\PostgreSQL\17"
          $data = Join-Path $env:RUNNER_TEMP "native-postgres-data"
          $password = [guid]::NewGuid().ToString()
          $passwordFile = Join-Path $env:RUNNER_TEMP "native-postgres-password.txt"
          Set-Content -Path $passwordFile -Value $password -NoNewline
          $env:PGPASSWORD = $password
          & "$env:PGROOT/bin/initdb.exe" -D $data -U test --pwfile $passwordFile --auth=scram-sha-256
          if ($LASTEXITCODE) { throw "initdb failed" }
          & "$env:PGROOT/bin/pg_ctl.exe" -D $data -l "$data/server.log" -o "-p 55433 -c listen_addresses='127.0.0.1'" start
          if ($LASTEXITCODE) { Get-Content "$data/server.log"; throw "pg_ctl failed" }
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            & "$env:PGROOT/bin/pg_isready.exe" -h 127.0.0.1 -p 55433 -U test
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($LASTEXITCODE) { Get-Content "$data/server.log"; throw "PostgreSQL did not start" }
          & "$env:PGROOT/bin/createdb.exe" -h 127.0.0.1 -p 55433 -U test test
          if ($LASTEXITCODE) { throw "createdb failed" }
          $source = Join-Path $env:RUNNER_TEMP "pgvector"
          git clone --depth 1 --branch v0.8.7 https://github.com/pgvector/pgvector.git $source
          if ($LASTEXITCODE) { throw "pgvector clone failed" }
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          $command = '"{0}" && cd /d "{1}" && nmake /F Makefile.win && nmake /F Makefile.win install' -f $vcvars, $source
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE) { throw "pgvector build failed" }
          Add-Content -Path $env:GITHUB_ENV -Value "NATIVE_TEST_DB_PASSWORD=$password"
      - name: Install Appium and WinCore
        working-directory: workers/appium
        run: npm ci
      - name: Native Windows acceptance
        working-directory: backend
        run: mvn -B --no-transfer-progress -pl platform-server '-Dtest=WindowsExecutionApiIntegrationTest' '-Dlogging.level.org.springframework.security=INFO' test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend checks
        working-directory: frontend
        run: npm run check

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config -q
