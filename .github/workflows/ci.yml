name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/electron/package-lock.json
      - name: Install Electron Worker dependencies
        working-directory: workers/electron
        run: npm ci
      - name: Install Chromium
        working-directory: backend
        run: mvn -B --no-transfer-progress -pl platform-server exec:java@playwright-install
      - name: Install display server for Electron
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Backend tests and checks
        working-directory: backend
        run: xvfb-run -a mvn -B --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend checks
        working-directory: frontend
        run: npm run check

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config -q
