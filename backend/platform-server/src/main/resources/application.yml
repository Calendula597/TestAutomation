spring:
  application:
    name: platform-server
  datasource:
    # Local defaults match deploy/docker-compose.yml; production overrides via env.
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/test_platform}
    username: ${APP_DB_USER:testplatform}
    password: ${APP_DB_PASSWORD:testplatform_dev}
    hikari:
      # A stopped database must turn the health probe DOWN in seconds, not
      # hang the endpoint for the default 30s pool timeout.
      connection-timeout: 3000
  flyway:
    enabled: true
  servlet:
    multipart:
      # The import controller enforces its own 5MB file limit; this keeps
      # oversized uploads below the container threshold.
      max-file-size: 6MB
      max-request-size: 6MB
  session:
    # Self-hosted single-team deployment; aligns with PRD session expiry.
    timeout: 30m

mybatis-plus:
  configuration:
    # Route enums with @EnumValue through MyBatis-Plus' composite handler.
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.CompositeEnumTypeHandler

server:
  port: 8080

app:
  model:
    # OpenAI-compatible provider (PRD #1: configured by the administrator;
    # the key is injected via environment, never committed).
    base-url: ${APP_MODEL_BASE_URL:}
    api-key: ${APP_MODEL_API_KEY:}
    name: ${APP_MODEL_NAME:}
  embedding:
    base-url: ${APP_EMBEDDING_BASE_URL:}
    api-key: ${APP_EMBEDDING_API_KEY:}
    model: ${APP_EMBEDDING_MODEL:}
  agent:
    max-sessions-per-project: 5
  secrets:
    # AES-256-GCM master key for environment secrets (base64, 32 bytes);
    # injected via APP_SECRETS_MASTER_KEY, never committed. Without a key,
    # secret writes fail explicitly instead of storing plaintext.
    master-key: ${APP_SECRETS_MASTER_KEY:}
  execution:
    api-timeout-seconds: ${APP_EXECUTION_API_TIMEOUT_SECONDS:120}
    web-timeout-seconds: ${APP_EXECUTION_WEB_TIMEOUT_SECONDS:120}
    electron-timeout-seconds: ${APP_EXECUTION_ELECTRON_TIMEOUT_SECONDS:120}
    windows-native-timeout-seconds: ${APP_EXECUTION_WINDOWS_NATIVE_TIMEOUT_SECONDS:120}
    performance-timeout-seconds: ${APP_EXECUTION_PERFORMANCE_TIMEOUT_SECONDS:60}
    whitebox-timeout-seconds: ${APP_EXECUTION_WHITEBOX_TIMEOUT_SECONDS:180}
    performance-max-vus: ${APP_EXECUTION_PERFORMANCE_MAX_VUS:8}
    performance-max-duration-seconds: ${APP_EXECUTION_PERFORMANCE_MAX_DURATION_SECONDS:30}
    schedule-sweep-ms: ${APP_EXECUTION_SCHEDULE_SWEEP_MS:1000}
  worker:
    # Lease length, offline detection window and sweeper cadence for the
    # persistent queue; tests shorten these to exercise recovery paths.
    lease-seconds: ${APP_WORKER_LEASE_SECONDS:30}
    offline-after-seconds: ${APP_WORKER_OFFLINE_AFTER_SECONDS:90}
    diagnostic-timeout-seconds: ${APP_WORKER_DIAGNOSTIC_TIMEOUT_SECONDS:120}
    sweep-interval-ms: ${APP_WORKER_SWEEP_INTERVAL_MS:5000}
    chromium-path: ${APP_WORKER_CHROMIUM_PATH:}
    appium-base-url: ${APP_WORKER_APPIUM_BASE_URL:http://127.0.0.1:4723}
    appium-home: ${APPIUM_HOME:}
    android-sdk: ${ANDROID_SDK_ROOT:}
    android-demo-apk: ${APP_WORKER_ANDROID_DEMO_APK:}
    powershell-path: ${APP_WORKER_POWERSHELL_PATH:C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe}
    windows-demo-script: ${APP_WORKER_WINDOWS_DEMO_SCRIPT:}
    k6-path: ${APP_WORKER_K6_PATH:}
    k6-image: ${APP_WORKER_K6_IMAGE:grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276}
  backup:
    dir: ${APP_BACKUP_DIR:./backups}
    postgres-image: ${APP_BACKUP_POSTGRES_IMAGE:pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a}
  evidence:
    # Screenshots, traces and downloads must be stored on a persistent volume.
    dir: ${APP_EVIDENCE_DIR:./evidence}

logging:
  level:
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
