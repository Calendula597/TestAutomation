spring:
  application:
    name: platform-server
  datasource:
    # Local defaults match deploy/docker-compose.yml; production overrides via env.
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/test_platform}
    username: ${APP_DB_USER:testplatform}
    password: ${APP_DB_PASSWORD:testplatform_dev}
    hikari:
      # A stopped database must turn the health probe DOWN in seconds, not
      # hang the endpoint for the default 30s pool timeout.
      connection-timeout: 3000
  flyway:
    enabled: true
  servlet:
    multipart:
      # The import controller enforces its own 5MB file limit; this keeps
      # oversized uploads below the container threshold.
      max-file-size: 6MB
      max-request-size: 6MB
  session:
    # Self-hosted single-team deployment; aligns with PRD session expiry.
    timeout: 30m

mybatis-plus:
  configuration:
    # Route enums with @EnumValue through MyBatis-Plus' composite handler.
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.CompositeEnumTypeHandler

server:
  port: 8080

app:
  model:
    # OpenAI-compatible provider (PRD #1: configured by the administrator;
    # the key is injected via environment, never committed).
    base-url: ${APP_MODEL_BASE_URL:}
    api-key: ${APP_MODEL_API_KEY:}
    name: ${APP_MODEL_NAME:}
  embedding:
    base-url: ${APP_EMBEDDING_BASE_URL:}
    api-key: ${APP_EMBEDDING_API_KEY:}
    model: ${APP_EMBEDDING_MODEL:}
  agent:
    max-sessions-per-project: 5

logging:
  level:
    org.springframework.security: TRACE
